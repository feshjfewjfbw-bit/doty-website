<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Doty Universe</title>
    <link rel='stylesheet' href='./style.css'>
    <base href='.'>
</head>
<body>
    <header>
        <h1>Doty Universe</h1>
        <nav>
            <a href='index.html'>Home</a>
            <a href='characters.html'>Characters</a>
            <a href='about.html'>About</a>
        </nav>
    </header>

    <main>
        <section class='hero'>
            <h2>Welcome to the Doty Universe</h2>
            <p>Explore the rich lore and stories of each hero.</p>
            <a href='characters.html' class='btn'>View Heroes</a>
        </section>

        <section class='character-list'>
            <h2>Meet the Heroes</h2>
            <div class='grid-filter'>
                <!-- Filter buttons injected by JS -->
            </div>
            <div class='hero-grid'>
                <!-- Heroes injected by JS -->
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Doty Universe</p>
    </footer>

    <!-- Hero Modal -->
    <div id="hero-modal" class="hero-modal">
        <div class="hero-modal-content">
            <span class="hero-modal-close">&times;</span>
            <img src="" id="modal-hero-photo" alt="Hero photo" class="modal-hero-img">
            <h2 id="modal-hero-name" class="modal-hero-name"></h2>
            <div id="modal-hero-lore" class="modal-hero-lore"></div>
        </div>
    </div>

    <script src='js/script.js'></script>
</body>
</html>
